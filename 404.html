<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satafi Studio</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#050505">
    <link rel="stylesheet" href="/style.css?v=3">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="apple-touch-icon" href="/assets/favicon.png">
</head>
<body>

    <header class="topbar" data-navbar>
        <div class="topbar-inner">
            <a href="/" class="brand" aria-label="Satafi Studio">
                <img src="/assets/satafi-logo.png" alt="" class="brand-logo">
                <span class="brand-text"><b>Satafi</b> Studio</span>
            </a>
            <nav class="top-links" aria-label="Ana menü">
                <a href="/#yaklasim" data-i18n="nav.approach">Yaklaşım</a>
                <a href="/#iletisim" data-i18n="nav.contact">İletişim</a>
            </nav>
            <div class="lang-pill" role="group" aria-label="Dil seçimi">
                <button type="button" data-lang="tr" class="active">TR</button>
                <button type="button" data-lang="en">EN</button>
                <button type="button" data-lang="fr">FR</button>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="aurora aurora-warm"></div>
            <div class="aurora aurora-cool"></div>
            <div class="hero-inner">
                <p class="eyebrow intro-step" data-i18n="e404.eyebrow">Hata 404</p>
                <h1 class="staccato">
                    <span class="word dim" data-i18n="e404.w1">Burada</span>
                    <span class="word" data-i18n="e404.w2">bir şey yok.</span>
                </h1>
                <p class="hero-lead intro-step" data-i18n="e404.lead">Aradığınız sayfa taşınmış ya da hiç var olmamış olabilir.</p>
                <div class="hero-actions intro-step">
                    <a href="/" class="btn btn-solid" data-magnetic data-i18n="e404.cta">Ana sayfaya dönün</a>
                </div>
            </div>
            <div class="hero-wordmark" data-text="404" aria-hidden="true">404</div>
        </section>
    </main>

    <script src="/script.js?v=3"></script>
</body>
</html>
